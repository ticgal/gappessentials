name: Secrets Scan

on:
  workflow_dispatch:
 
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main
      - develop
 
permissions:
  contents: read
  pull-requests: read
 
jobs:
  secrets-scan:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    uses: TICGAL-Dev/.github-private/.github/workflows/web_secrets-scan.yml@v1
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
