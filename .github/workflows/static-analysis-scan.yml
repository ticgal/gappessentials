name: Static Analysis

on:
  workflow_dispatch:

  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main
      - develop

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  static-analysis:
    # Permite ejecución manual y evita pull requests en draft.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: TICGAL-Dev/.github-private/.github/workflows/web_static-analysis-scan.yml@v1
    with:
      glpi_version: "11.0.x"
      plugin_name: "gappessentials"
